{% extends 'base.html' %}

{% block title %}{{ doc.title }} — ТурЭксперт{% endblock %}

{% block content %}
<section class="min-h-screen bg-slate-50 py-24">
    <div class="max-w-3xl mx-auto px-4">
        <a href="{% url 'index' %}" class="inline-flex items-center text-[#1e3a5f] hover:underline mb-8">
            <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
            </svg>
            На главную
        </a>

        <div class="bg-white rounded-2xl p-8 md:p-12 shadow-sm border border-slate-200">
            <h1 class="text-3xl font-bold text-[#1e3a5f] mb-8">{{ doc.title }}</h1>
            <div class="prose prose-slate max-w-none text-slate-600 space-y-6">
                {{ doc.content|safe }}
            </div>
        </div>
    </div>
</section>
{% endblock %}
